name: Bootstrap product source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Expand verified product source
        id: expand
        shell: powershell
        run: |
          if (!(Test-Path 'seed.part00')) {
            Write-Host 'Source is already normalized; nothing to expand.'
            'expanded=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          $parts = Get-ChildItem 'seed.part*' | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Expected 5 seed parts; found $($parts.Count)." }
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('source-seed.zip', [Convert]::FromBase64String($base64))

          $hash = (Get-FileHash 'source-seed.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '8c4cb4980b18809f0821c684aff7f928e41030cf3a6b275aa7ca2276e248d2cc'
          if ($hash -ne $expected) { throw "Source seed hash mismatch: $hash" }

          New-Item -ItemType Directory -Force -Path 'source-seed' | Out-Null
          Expand-Archive 'source-seed.zip' 'source-seed' -Force
          Get-ChildItem 'source-seed' -Force | ForEach-Object {
            Copy-Item $_.FullName '.' -Recurse -Force
          }

          Remove-Item 'seed.part*' -Force
          Remove-Item 'source-seed.zip' -Force
          Remove-Item 'source-seed' -Recurse -Force
          'expanded=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Commit normalized source
        if: steps.expand.outputs.expanded == 'true'
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: deliver UStracker 1.00.00.000 product'
          git push origin HEAD:main
