name: RED CI fail-fast once

on:
  push:
    branches: [fix/stability-login-webview-20260913]

permissions:
  contents: write

jobs:
  red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/stability-login-webview-20260913
      - name: Confirm CI policy regression is red
        id: redtest
        shell: powershell
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check pytest==9.0.2
          python -m pytest -q tests\test_release_workflow.py
          "exit_code=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Require the pre-fix test to fail
        shell: powershell
        run: |
          if ('${{ steps.redtest.outputs.exit_code }}' -eq '0') { throw 'CI fail-fast regression test unexpectedly passed before fix' }
          Write-Host "RED_CI_CONFIRMED exit=${{ steps.redtest.outputs.exit_code }}"
      - name: Remove one-time workflow
        if: always()
        shell: powershell
        run: |
          Remove-Item '.github\workflows\red-ci-failfast-once.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github\workflows\red-ci-failfast-once.yml
          git commit -m 'chore: remove one-time CI RED workflow'
          git push origin HEAD:fix/stability-login-webview-20260913
