name: Test uvicorn logging hypothesis once

on:
  push:
    branches: [fix/stability-login-webview-20260913]

permissions:
  actions: read
  contents: write

jobs:
  hypothesis:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/stability-login-webview-20260913
      - uses: actions/download-artifact@v4
        with:
          name: UStracker-stability-candidate
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34789108654
      - name: Patch candidate only and test pythonw without redirects
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem candidate -Recurse -File -Filter 'UStracker_*_win-x64.zip'|Select-Object -First 1
          $stage=Join-Path $env:RUNNER_TEMP 'ustracker-uvicorn-hypothesis'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip.FullName $stage -Force
          $server=Join-Path $stage 'Runtime\Lib\site-packages\ustracker\server.py'
          $text=Get-Content $server -Raw -Encoding UTF8
          $old="uvicorn.Config(app, host='127.0.0.1', port=port, log_level='info', access_log=False)"
          $new="uvicorn.Config(app, host='127.0.0.1', port=port, log_level='info', access_log=False, log_config=None)"
          if(-not $text.Contains($old)){throw 'uvicorn.Config target not found'}
          [IO.File]::WriteAllText($server,$text.Replace($old,$new),(New-Object Text.UTF8Encoding($false)))
          Remove-Item "$stage\UserData\State\backend.json" -Force -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath "$stage\Runtime\pythonw.exe" -ArgumentList @('-m','ustracker.server','--root',$stage) -WorkingDirectory $stage -PassThru
          $stateFile=Join-Path $stage 'UserData\State\backend.json'
          $healthy=$false
          for($i=0;$i -lt 80;$i++){
            if($p.HasExited){break}
            if(Test-Path $stateFile){
              try{$s=Get-Content $stateFile -Raw|ConvertFrom-Json;$h=Invoke-RestMethod -Uri "http://127.0.0.1:$($s.port)/api/v1/health" -TimeoutSec 2;if($h.status -eq 'ok'){$healthy=$true;break}}catch{}
            }
            Start-Sleep -Milliseconds 250
          }
          Write-Host "PATCHED_PYTHONW_EXITED=$($p.HasExited)"
          if($p.HasExited){Write-Host "PATCHED_PYTHONW_EXIT=$($p.ExitCode)"}
          Write-Host "PATCHED_PYTHONW_HEALTHY=$healthy"
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          if(-not $healthy){throw 'log_config=None did not fix pythonw startup'}
      - name: Remove one-time workflow
        if: always()
        shell: powershell
        run: |
          Remove-Item '.github\workflows\uvicorn-log-hypothesis-once.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github\workflows\uvicorn-log-hypothesis-once.yml
          git commit -m 'chore: remove one-time uvicorn hypothesis workflow'
          git push origin HEAD:fix/stability-login-webview-20260913
