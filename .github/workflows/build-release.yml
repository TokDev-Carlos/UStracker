name: Build UStracker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar GitHub Release após build e validação'
        required: true
        type: boolean
        default: false
      release_confirmation:
        description: 'Digite exatamente: PUBLICAR RELEASE USTRACKER'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        shell: powershell
        run: |
          $version = (Get-Content VERSION.json -Raw | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'VERSION.json sem version' }
          "USTRACKER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install test dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-package.txt pytest==9.0.2 httpx==0.28.1

      - name: Python verification
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\src"
          $env:USTRACKER_DEV_PLAINTEXT = "1"
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check frontend\app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests\test_frontend_boot.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests\test_frontend_boot_error.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Bootstrap
        shell: powershell
        run: msbuild host\Bootstrap\Bootstrap.csproj /restore /m /p:Configuration=Release /p:Platform=x64

      - name: Build Shell
        shell: powershell
        run: msbuild host\Shell\Shell.csproj /restore /m /p:Configuration=Release /p:Platform=x64

      - name: Build Updater
        shell: powershell
        run: msbuild host\Updater\Updater.csproj /restore /m /p:Configuration=Release /p:Platform=x64

      - name: Build portable package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1

      - name: Release gate
        shell: powershell
        run: python tools\release_gate.py --candidate "Dist\UStracker_${env:USTRACKER_VERSION}_win-x64.zip"

      - name: Portable startup smoke
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\smoke_portable.ps1 -Candidate "Dist\UStracker_${env:USTRACKER_VERSION}_win-x64.zip"

      - name: Create source snapshot
        shell: powershell
        run: |
          $source = "Dist\UStracker_$($env:USTRACKER_VERSION)_Source.zip"
          git archive --format=zip --output=$source HEAD
          $h=(Get-FileHash $source -Algorithm SHA256).Hash
          "$h  $(Split-Path $source -Leaf)" | Set-Content ($source + '.sha256') -Encoding ASCII

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UStracker-${{ env.USTRACKER_VERSION }}-win-x64
          path: |
            Dist/UStracker_${{ env.USTRACKER_VERSION }}_win-x64.zip
            Dist/UStracker_${{ env.USTRACKER_VERSION }}_win-x64.zip.sha256
            Dist/UStracker_${{ env.USTRACKER_VERSION }}_Source.zip
            Dist/UStracker_${{ env.USTRACKER_VERSION }}_Source.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release == true && inputs.release_confirmation == 'PUBLICAR RELEASE USTRACKER'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=$env:USTRACKER_VERSION
          $tag="v$version"
          $portable="Dist\UStracker_${version}_win-x64.zip"
          $source="Dist\UStracker_${version}_Source.zip"
          cmd /c "gh release view $tag >NUL 2>NUL"
          $releaseExists = ($LASTEXITCODE -eq 0)
          if (-not $releaseExists) {
            gh release create $tag --target $env:GITHUB_SHA --title "UStracker $version" --notes 'Release portátil Windows x64. Extraia o ZIP e execute UStracker.exe.'
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar GitHub Release' }
          }
          gh release upload $tag $portable "$portable.sha256" $source "$source.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar assets da Release' }
