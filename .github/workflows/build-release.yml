name: Build and Release UStracker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install test dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-package.txt pytest==9.0.2 httpx==0.28.1

      - name: Python verification
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\src"
          $env:USTRACKER_DEV_PLAINTEXT = "1"
          python -m pytest -q
          python -m compileall -q src

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Bootstrap
        shell: powershell
        run: msbuild host\Bootstrap\Bootstrap.csproj /restore /m /p:Configuration=Release /p:Platform=x64

      - name: Build Shell
        shell: powershell
        run: msbuild host\Shell\Shell.csproj /restore /m /p:Configuration=Release /p:Platform=x64

      - name: Build Updater
        shell: powershell
        run: msbuild host\Updater\Updater.csproj /restore /m /p:Configuration=Release /p:Platform=x64

      - name: Build portable package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1

      - name: Release gate
        shell: powershell
        run: python tools\release_gate.py --candidate Dist\UStracker_1.00.00.000_win-x64.zip

      - name: Create source snapshot
        shell: powershell
        run: |
          git archive --format=zip --output=Dist\UStracker_1.00.00.000_Source.zip HEAD
          $h=(Get-FileHash Dist\UStracker_1.00.00.000_Source.zip -Algorithm SHA256).Hash
          "$h  UStracker_1.00.00.000_Source.zip" | Set-Content Dist\UStracker_1.00.00.000_Source.zip.sha256 -Encoding ASCII

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UStracker-1.00.00.000-win-x64
          path: |
            Dist/UStracker_1.00.00.000_win-x64.zip
            Dist/UStracker_1.00.00.000_win-x64.zip.sha256
            Dist/UStracker_1.00.00.000_Source.zip
            Dist/UStracker_1.00.00.000_Source.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v1.00.00.000'
          cmd /c "gh release view $tag >NUL 2>NUL"
          $releaseExists = ($LASTEXITCODE -eq 0)
          if (-not $releaseExists) {
            gh release create $tag --target $env:GITHUB_SHA --title 'UStracker 1.00.00.000' --notes 'Release portátil Windows x64. Extraia o ZIP e execute UStracker.exe.'
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar GitHub Release' }
          }
          gh release upload $tag Dist\UStracker_1.00.00.000_win-x64.zip Dist\UStracker_1.00.00.000_win-x64.zip.sha256 Dist\UStracker_1.00.00.000_Source.zip Dist\UStracker_1.00.00.000_Source.zip.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar assets da Release' }
