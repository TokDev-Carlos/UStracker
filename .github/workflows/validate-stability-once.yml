name: Validate stability fix once

on:
  push:
    branches: [fix/stability-login-webview-20260913]

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/stability-login-webview-20260913

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install test dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-package.txt pytest==9.0.2 httpx==0.28.1

      - name: Verify source and regressions
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\src"
          $env:USTRACKER_DEV_PLAINTEXT = "1"
          python -m pytest -q
          python -m compileall -q src
          node --check frontend\app.js
          node tests\test_frontend_boot.js
          node tests\test_frontend_boot_error.js

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Bootstrap
        shell: powershell
        run: msbuild host\Bootstrap\Bootstrap.csproj /restore /m /p:Configuration=Release /p:Platform=x64

      - name: Build Shell
        shell: powershell
        run: msbuild host\Shell\Shell.csproj /restore /m /p:Configuration=Release /p:Platform=x64

      - name: Build Updater
        shell: powershell
        run: msbuild host\Updater\Updater.csproj /restore /m /p:Configuration=Release /p:Platform=x64

      - name: Build portable package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1

      - name: Release gate without publishing
        shell: powershell
        run: |
          $version = (Get-Content VERSION.json -Raw | ConvertFrom-Json).version
          python tools\release_gate.py --candidate "Dist\UStracker_${version}_win-x64.zip"

      - name: Upload validated candidate
        uses: actions/upload-artifact@v4
        with:
          name: UStracker-stability-candidate
          path: |
            Dist/UStracker_*_win-x64.zip
            Dist/UStracker_*_win-x64.zip.sha256
          if-no-files-found: error

      - name: Remove one-time validation workflow
        if: success()
        shell: powershell
        run: |
          Remove-Item '.github\workflows\validate-stability-once.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github\workflows\validate-stability-once.yml
          git commit -m 'chore: remove one-time stability validation workflow'
          git push origin HEAD:fix/stability-login-webview-20260913
