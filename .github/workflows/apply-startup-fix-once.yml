name: Apply backend startup fix once

on:
  push:
    branches: [fix/stability-login-webview-20260913]

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/stability-login-webview-20260913

      - name: Apply backend fix
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = New-Object Text.UTF8Encoding($false)
          $serverPath = 'src\ustracker\server.py'
          $server = [IO.File]::ReadAllText($serverPath)
          $old = "uvicorn.Config(app, host='127.0.0.1', port=port, log_level='info', access_log=False)"
          $new = "uvicorn.Config(app, host='127.0.0.1', port=port, log_level='info', access_log=False, log_config=None)"
          if (-not $server.Contains($old)) { throw 'server.py target not found' }
          [IO.File]::WriteAllText($serverPath, $server.Replace($old, $new), $utf8)

      - name: Verify backend regression
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pytest==9.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests\test_gui_backend_logging.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit backend fix and remove one-time workflow
        shell: powershell
        run: |
          Remove-Item '.github\workflows\apply-startup-fix-once.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src\ustracker\server.py .github\workflows\apply-startup-fix-once.yml
          git commit -m 'fix: make GUI backend startup console-independent'
          git push origin HEAD:fix/stability-login-webview-20260913
