name: Diagnose packaged backend once

on:
  push:
    branches: [fix/stability-login-webview-20260913]

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/stability-login-webview-20260913

      - name: Download validated candidate
        uses: actions/download-artifact@v4
        with:
          name: UStracker-stability-candidate
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34789108654

      - name: Diagnose embedded runtime and backend
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem candidate -Recurse -File -Filter 'UStracker_*_win-x64.zip' | Select-Object -First 1
          if ($null -eq $zip) { throw 'Candidate ZIP not found' }
          $stage = Join-Path $env:RUNNER_TEMP 'ustracker-diagnostic'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip.FullName $stage -Force
          Write-Host '=== Runtime files ==='
          Get-Item "$stage\Runtime\python.exe", "$stage\Runtime\pythonw.exe", "$stage\UStracker.exe" | Format-Table FullName,Length
          Write-Host '=== Runtime imports ==='
          & "$stage\Runtime\python.exe" -c "import sys,sqlite3,fastapi,uvicorn,sqlcipher3,ustracker; print(sys.version); print('sqlite',sqlite3.sqlite_version); print('ustracker',ustracker.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "runtime imports exit=$LASTEXITCODE" }
          Write-Host '=== Direct backend start ==='
          $stdout = Join-Path $env:RUNNER_TEMP 'backend.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'backend.stderr.log'
          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue
          $args = @('-m','ustracker.server','--root',$stage)
          $p = Start-Process -FilePath "$stage\Runtime\python.exe" -ArgumentList $args -WorkingDirectory $stage -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $stateFile = Join-Path $stage 'UserData\State\backend.json'
          $healthy = $false
          for ($i=0; $i -lt 80; $i++) {
            if ($p.HasExited) { break }
            if (Test-Path $stateFile) {
              Write-Host "STATE=$(Get-Content $stateFile -Raw)"
              try {
                $state = Get-Content $stateFile -Raw | ConvertFrom-Json
                $h = Invoke-RestMethod -Uri "http://127.0.0.1:$($state.port)/api/v1/health" -TimeoutSec 2
                if ($h.status -eq 'ok') { $healthy = $true; break }
              } catch { Write-Host "health pending: $($_.Exception.Message)" }
            }
            Start-Sleep -Milliseconds 250
          }
          Write-Host "DIRECT_PROCESS_EXITED=$($p.HasExited)"
          if ($p.HasExited) { Write-Host "DIRECT_EXIT_CODE=$($p.ExitCode)" }
          Write-Host "DIRECT_HEALTHY=$healthy"
          Write-Host '=== stdout ==='; if (Test-Path $stdout) { Get-Content $stdout -Raw }
          Write-Host '=== stderr ==='; if (Test-Path $stderr) { Get-Content $stderr -Raw }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not $healthy) { throw 'Direct embedded backend is not healthy' }

      - name: Remove one-time diagnostic workflow
        if: success()
        shell: powershell
        run: |
          Remove-Item '.github\workflows\smoke-candidate-once.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github\workflows\smoke-candidate-once.yml
          git commit -m 'chore: remove one-time backend diagnostic workflow'
          git push origin HEAD:fix/stability-login-webview-20260913
