name: Smoke validated candidate once

on:
  push:
    branches: [fix/stability-login-webview-20260913]

permissions:
  actions: read
  contents: write

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/stability-login-webview-20260913

      - name: Download validated candidate
        uses: actions/download-artifact@v4
        with:
          name: UStracker-stability-candidate
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34789108654

      - name: Verify release policy tests
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pytest==9.0.2
          python -m pytest -q tests\test_release_workflow.py tests\test_shell_window.py

      - name: Run packaged launcher smoke
        shell: powershell
        run: |
          $zip = Get-ChildItem candidate -Recurse -File -Filter 'UStracker_*_win-x64.zip' | Select-Object -First 1
          if ($null -eq $zip) { throw 'Candidate ZIP not found in artifact' }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\smoke_portable.ps1 -Candidate $zip.FullName

      - name: Remove one-time smoke workflow
        if: success()
        shell: powershell
        run: |
          Remove-Item '.github\workflows\smoke-candidate-once.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github\workflows\smoke-candidate-once.yml
          git commit -m 'chore: remove one-time candidate smoke workflow'
          git push origin HEAD:fix/stability-login-webview-20260913
