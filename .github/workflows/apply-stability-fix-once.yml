name: Apply stability fix once

on:
  push:
    branches: [fix/stability-login-webview-20260913]

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/stability-login-webview-20260913

      - name: Patch frontend root cause
        shell: powershell
        run: |
          $path = 'frontend\app.js'
          $lines = Get-Content $path -Encoding UTF8
          $count401 = 0
          $countNotOk = 0
          $countBoot = 0
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith('  if(r.status===401)')) {
              $lines[$i] = "  if(r.status===401){const err=new Error('Sessao encerrada');err.status=401;me=null;csrf='';throw err}"
              $count401++
            }
            elseif ($lines[$i].StartsWith('  if(!r.ok)throw new Error')) {
              $lines[$i] = "  if(!r.ok){const err=new Error(typeof data==='string'?data:(data.detail?.code||data.detail||data.error||JSON.stringify(data)));err.status=r.status;throw err}"
              $countNotOk++
            }
            elseif ($lines[$i].StartsWith('async function boot()')) {
              $lines[$i] = "async function boot(){const pub=await api('/public');applyBrand(pub);const st=await api('/auth/setup-status');if(st.enrolled===0)return setupScreen();try{me=await api('/auth/me');csrf=document.cookie.split('; ').find(x=>x.startsWith('us_csrf='))?.split('=')[1]||'';renderShell();await show('dashboard')}catch(err){if(err?.status===401)return loginScreen(st,pub);throw err}}"
              $countBoot++
            }
          }
          if ($count401 -ne 1 -or $countNotOk -ne 1 -or $countBoot -ne 1) { throw "Patch count invalido: 401=$count401 notOk=$countNotOk boot=$countBoot" }
          [IO.File]::WriteAllLines((Resolve-Path $path), $lines, (New-Object Text.UTF8Encoding($false)))

      - name: Verify frontend regression tests
        shell: powershell
        run: |
          node --check frontend\app.js
          node tests\test_frontend_boot.js
          node tests\test_frontend_boot_error.js

      - name: Commit fix and remove one-time workflow
        shell: powershell
        run: |
          Remove-Item '.github\workflows\apply-stability-fix-once.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend\app.js .github\workflows\apply-stability-fix-once.yml
          git commit -m 'fix: stop login boot recursion and surface backend failures'
          git push origin HEAD:fix/stability-login-webview-20260913
