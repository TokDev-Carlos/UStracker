[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ustracker"
version = "1.0.0"
description = "UStracker local-first fleet, contract and financial management"
requires-python = ">=3.13,<3.14"
authors = [{name = "CRJ"}]
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "cryptography==46.0.4",
  "Pillow==12.3.0",
  "openpyxl==3.1.5",
  "python-multipart==0.0.29",
  "sqlcipher3==0.6.2"
]

[tool.setuptools.packages.find]
where = ["src"]
