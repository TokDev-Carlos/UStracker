[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ustracker"
dynamic = ["version"]
description = "UStracker local-first fleet, contract and financial management"
requires-python = ">=3.13,<3.14"
authors = [{name = "CRJ"}]
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "cryptography==46.0.4",
  "Pillow==12.3.0",
  "openpyxl==3.1.5",
  "python-multipart==0.0.29",
  "sqlcipher3==0.6.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "ustracker.__version__"}

# Qualidade gradual (Centro de Comando 2026-10-07): só erros reais; sem formatar o projeto inteiro.
[tool.ruff]
target-version = "py313"
line-length = 160
extend-exclude = ["context", "Dist", "dist", "build", "src/ustracker/_vendor"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.13"
files = []  # módulos novos entram aqui um a um
ignore_missing_imports = true
